# Prometheus — single source of truth for all constants.
# Import via: from prometheus.config import cfg

project:
  name: prometheus
  version: "0.2.0"
  description: "Daily wildfire risk forecasting for Nepal (pre-monsoon)"

# ---------------------------------------------------------------------------
# Paths (relative to project root)
# ---------------------------------------------------------------------------
paths:
  root: .
  data: data
  raw: data/raw
  firms_raw: data/raw/firms
  firms_archives: data/raw/firms/archives
  firms_chunks: data/raw/firms/chunks
  gee_raw: data/raw/gee
  static: data/static
  cube: data/cube
  models: data/models
  runs: runs
  docs: docs
  configs: configs
  nepal_mask: data/static/nepal_mask_1km_roiAligned.tif
  elevation: data/static/elevation_static_srtm.tif
  slope: data/static/slope_static_srtm.tif

# ---------------------------------------------------------------------------
# Study region (deg, EPSG:4326) — matches nepal mask GeoTIFF
# ---------------------------------------------------------------------------
roi:
  min_lon: 80.01294235652578
  min_lat: 26.338604130384372
  max_lon: 88.20557774769583
  max_lat: 30.515770201540146

# ---------------------------------------------------------------------------
# Canonical grid (must match nepal_mask GeoTIFF)
# ---------------------------------------------------------------------------
grid:
  height: 465
  width: 912
  crs: "EPSG:4326"
  transform:
    - 0.008983152841195215   # a  pixel width (~1 km)
    - 0.0                    # b
    - 80.01294235652578      # c  origin x (west)
    - 0.0                    # d
    - -0.008983152841195215  # e  pixel height (negative = north-up)
    - 30.515770201540146     # f  origin y (north)
  nodata: -9999.0
  mask_valid_value: 1

# ---------------------------------------------------------------------------
# Temporal scope
# ---------------------------------------------------------------------------
years:
  train_start: 2016
  train_end: 2026
  # Labels + predictors for LOYO training (pre-monsoon Jan–May each year)
  all: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # Prior MODIS only — doy fire climatology feature / baseline (no predictor rasters)
  climatology: [2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]

season:
  months: [1, 2, 3, 4, 5]
  start_month: 1
  start_day: 1
  end_month: 5
  end_day: 31

# ---------------------------------------------------------------------------
# Labels (FIRMS area API — country endpoints are currently unavailable)
# ---------------------------------------------------------------------------
labels:
  # SP = standard processing archive via area API only
  satellites:
    - VIIRS_SNPP_SP
    - VIIRS_NOAA20_SP
    - MODIS_SP
  # area | data_availability | kml_fire_footprints | map_key | missing_data
  # country / countries: not available on FIRMS status board right now
  api_endpoint: area
  modis_confidence_min: 50
  viirs_confidence: ["nominal", "high"]
  drop_type_nonzero: true
  dilate_pixels: 1
  bbox: [80.01294235652578, 26.338604130384372, 88.20557774769583, 30.515770201540146]

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  weather_daily:
    - t2m_max
    - t2m_min
    - t2m
    - d2m
    - precip
    - u10
    - v10
    - soil_water_l1
    - surface_pressure
    - rh
    - vpd
    - wind_speed
  vegetation:
    - ndvi
    - evi
    - ndvi_anomaly
  thermal:
    - lst_day
    - lst_night
    - lst_diff
  terrain_static:
    - elevation
    - slope
    - aspect_sin
    - aspect_cos
    - twi
  landcover_static:
    - tree_frac
    - shrub_frac
    - grass_frac
    - cropland_frac
  human_static:
    - dist_road
    - dist_settlement
    - pop_density
  history:
    - fire_clim
    - days_since_fire
    - fires_1yr
    - fires_3yr
    - fires_5yr
  temporal:
    - doy_sin
    - doy_cos
    - consecutive_dry_days
    - days_since_rain
    - precip_7d
    - precip_30d
    - t2m_max_7d
    - rh_min_7d
    - wind_max_7d
  forest_worldcover_classes: [10, 20, 30]

# ---------------------------------------------------------------------------
# Modeling
# ---------------------------------------------------------------------------
modeling:
  positive_negative_ratio: 20
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  early_stopping_rounds: 50
  random_seed: 42
  horizons: [1, 7]

# ---------------------------------------------------------------------------
# Evaluation / CV
# ---------------------------------------------------------------------------
cv:
  scheme: leave_one_year_out
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  primary_metric: pr_auc
  top_k_fractions: [0.05, 0.10]

risk_classes:
  names: [Low, Moderate, High, VeryHigh, Extreme]
  quantiles: [0.0, 0.50, 0.75, 0.90, 0.95, 1.0]

regions:
  - Terai
  - Chure
  - MiddleMountains
  - HighMountains
