[project]
name = "prometheus"
version = "0.2.0"
description = "Prometheus: daily wildfire risk forecasting for Nepal"
readme = "BUILD_PLAN.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "xarray",
    "zarr",
    "rasterio",
    "rioxarray",
    "geopandas",
    "shapely",
    "earthengine-api",
    "lightgbm",
    "scikit-learn",
    "shap",
    "matplotlib",
    "tqdm",
    "pydantic-settings",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
